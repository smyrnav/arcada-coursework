name: Update dashboard

on:
  schedule:
    - cron: "0 16 * * 5"   # Fridays 16:00 UTC, after Helsinki close
  workflow_dispatch:        # "Run workflow" button in the Actions tab
  push:
    paths:                  # new submissions uploaded -> refresh right away
      - "submissions-xlsx/**"

permissions:
  contents: write

concurrency:
  group: dashboard-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install openpyxl
      - run: python3 ingest.py submissions-xlsx
      - run: python3 update.py
      - name: Commit updated data and dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add submissions dashboard.html
          git diff --cached --quiet && exit 0
          git commit -m "Update standings $(date -u +%F)"
          git pull --rebase origin main
          git push
